<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <title>Sip N Dine Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #000;
      touch-action: manipulation;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      height: 100%;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transform-origin: center center;
      transition:
        opacity 0.85s cubic-bezier(0.32, 0.72, 0, 1),
        visibility 0.85s cubic-bezier(0.32, 0.72, 0, 1),
        transform 0.85s cubic-bezier(0.32, 0.72, 0, 1),
        filter 0.85s cubic-bezier(0.32, 0.72, 0, 1);
    }

    #loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(1.06);
      filter: blur(32px) brightness(1.1);
    }

    .loader-bg {
      position: absolute;
      inset: 0;
      background: #f5f5f7;
      overflow: hidden;
    }

    .mesh {
      position: absolute;
      inset: -20%;
      background:
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(255, 190, 160, 0.45), transparent 55%),
        radial-gradient(ellipse 70% 55% at 85% 75%, rgba(160, 200, 255, 0.5), transparent 55%),
        radial-gradient(ellipse 60% 50% at 50% 50%, rgba(200, 255, 210, 0.35), transparent 50%),
        linear-gradient(180deg, #fafafa 0%, #ececf1 50%, #f5f5f7 100%);
      animation: mesh-shift 12s ease-in-out infinite alternate;
    }

    @keyframes mesh-shift {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.08) translate(-2%, 1%); }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(80px);
      will-change: transform;
      transition: transform 0.3s ease-out;
    }

    .orb-1 {
      width: 70vmax;
      height: 70vmax;
      background: rgba(255, 170, 140, 0.55);
      top: -25%;
      left: -20%;
      animation: float-1 10s ease-in-out infinite;
    }

    .orb-2 {
      width: 65vmax;
      height: 65vmax;
      background: rgba(140, 190, 255, 0.5);
      bottom: -20%;
      right: -25%;
      animation: float-2 11s ease-in-out infinite;
    }

    .orb-3 {
      width: 50vmax;
      height: 50vmax;
      background: rgba(200, 255, 180, 0.4);
      top: 35%;
      left: 30%;
      animation: float-3 9s ease-in-out infinite;
    }

    @keyframes float-1 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(8%, 10%); }
    }

    @keyframes float-2 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(-10%, -6%); }
    }

    @keyframes float-3 {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(6%, -8%); }
    }

    .glass-veil {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(56px) saturate(200%);
      -webkit-backdrop-filter: blur(56px) saturate(200%);
      opacity: 0;
      transition: opacity 1s ease;
    }

    #loader.sharp .glass-veil {
      opacity: 1;
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse 90% 80% at 50% 45%, transparent 40%, rgba(0, 0, 0, 0.06) 100%);
    }

    .loader-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      z-index: 2;
      filter: blur(20px);
      opacity: 0;
      transform: scale(0.92);
      transition:
        filter 1.1s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.8s cubic-bezier(0.22, 1, 0.36, 1),
        transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #loader.sharp .loader-stage {
      filter: blur(0);
      opacity: 1;
      transform: scale(1);
    }

    .hero-gif {
      width: min(52vw, 220px);
      height: min(52vw, 220px);
      object-fit: contain;
      animation: breathe 3s ease-in-out infinite;
      filter: drop-shadow(0 20px 48px rgba(0, 0, 0, 0.12));
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.04) translateY(-6px); }
    }

    .loader-label {
      margin-top: 1.75rem;
      font-size: clamp(0.75rem, 2.5vw, 0.875rem);
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: rgba(0, 0, 0, 0.4);
    }

    .progress-dock {
      position: absolute;
      left: 50%;
      bottom: max(2rem, env(safe-area-inset-bottom, 2rem));
      transform: translateX(-50%);
      width: min(420px, calc(100vw - 3rem));
      padding: 1rem 1.25rem;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.04),
        0 16px 48px rgba(0, 0, 0, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(32px) saturate(180%);
      -webkit-backdrop-filter: blur(32px) saturate(180%);
    }

    .progress-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 0.65rem;
    }

    .progress-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: rgba(0, 0, 0, 0.5);
      letter-spacing: -0.02em;
    }

    .progress-pct {
      font-size: 0.8125rem;
      font-weight: 600;
      color: rgba(0, 0, 0, 0.65);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.02em;
    }

    .progress-wrap {
      width: 100%;
      height: 4px;
      background: rgba(0, 0, 0, 0.07);
      border-radius: 100px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 100px;
      background: #1a1a1a;
      transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.2);
    }

    #viewer-wrap {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #000;
      opacity: 0;
      transform: scale(1.03);
      transition:
        opacity 0.7s cubic-bezier(0.32, 0.72, 0, 1) 0.15s,
        transform 0.9s cubic-bezier(0.32, 0.72, 0, 1) 0.1s;
    }

    #viewer-wrap.ready {
      opacity: 1;
      transform: scale(1);
    }

    #viewer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }

    @media (prefers-reduced-motion: reduce) {
      .orb, .mesh, .hero-gif { animation: none; }
      #loader, .loader-stage, #viewer-wrap { transition-duration: 0.01ms; }
    }
  </style>
</head>
<body>
  <div id="loader" aria-live="polite" aria-busy="true">
    <div class="loader-bg" aria-hidden="true">
      <div class="mesh"></div>
      <div class="orb orb-1" data-parallax="0.03"></div>
      <div class="orb orb-2" data-parallax="-0.025"></div>
      <div class="orb orb-3" data-parallax="0.02"></div>
    </div>
    <div class="glass-veil" aria-hidden="true"></div>
    <div class="vignette" aria-hidden="true"></div>

    <div class="loader-stage">
      <img
        class="hero-gif"
        src="original-b10f1ea4b07bce2beb364c0890c802a7.gif"
        alt=""
        width="220"
        height="220"
      />
      <p class="loader-label">Sip N Dine</p>
    </div>

    <div class="progress-dock">
      <div class="progress-row">
        <span class="progress-label">Preparing your menu</span>
        <span class="progress-pct" id="pct">0%</span>
      </div>
      <div
        class="progress-wrap"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progressbar"
      >
        <div class="progress-bar" id="progress"></div>
      </div>
    </div>
  </div>

  <div id="viewer-wrap">
    <embed id="viewer" type="application/pdf" title="Sip N Dine Menu" />
  </div>

  <script>
    const PDF_URL = 'menu1.pdf';
    const PDF_HASH = '#view=FitH&toolbar=0&navpanes=0';

    const loader = document.getElementById('loader');
    const viewerWrap = document.getElementById('viewer-wrap');
    const progress = document.getElementById('progress');
    const pctEl = document.getElementById('pct');
    const progressbar = document.getElementById('progressbar');
    const viewer = document.getElementById('viewer');
    const orbs = document.querySelectorAll('[data-parallax]');

    let blobUrl = null;

    requestAnimationFrame(function () {
      loader.classList.add('sharp');
    });

    function parallax(x, y) {
      orbs.forEach(function (orb) {
        const factor = parseFloat(orb.dataset.parallax);
        orb.style.transform =
          'translate(' + x * factor * 100 + 'px, ' + y * factor * 100 + 'px)';
      });
    }

    window.addEventListener('pointermove', function (e) {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;
      parallax(x, y);
    }, { passive: true });

    function setProgress(percent) {
      const p = Math.min(100, Math.round(percent));
      progress.style.width = p + '%';
      pctEl.textContent = p + '%';
      progressbar.setAttribute('aria-valuenow', String(p));
    }

    function hideLoader() {
      loader.classList.add('done');
      loader.setAttribute('aria-busy', 'false');
      viewerWrap.classList.add('ready');
    }

    async function fetchPdf() {
      const res = await fetch(PDF_URL);
      if (!res.ok) throw new Error('Could not load menu');

      const total = Number(res.headers.get('content-length')) || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let loaded = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        if (total > 0) {
          setProgress((loaded / total) * 100);
        } else {
          setProgress(Math.min(95, loaded / 250000));
        }
      }

      setProgress(100);
      const blob = new Blob(chunks, { type: 'application/pdf' });
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(blob);
      return blobUrl;
    }

    function showPdf(url) {
      viewer.src = url + PDF_HASH;
      viewer.addEventListener('load', hideLoader, { once: true });
      setTimeout(hideLoader, 1000);
    }

    function startLoad() {
      fetchPdf()
        .then(showPdf)
        .catch(function () {
          document.querySelector('.progress-label').textContent = 'Tap to retry';
          pctEl.textContent = '';
          loader.style.cursor = 'pointer';
          loader.onclick = function () {
            loader.onclick = null;
            loader.style.cursor = '';
            document.querySelector('.progress-label').textContent = 'Preparing your menu';
            pctEl.textContent = '0%';
            setProgress(0);
            startLoad();
          };
        });
    }

    if ('requestIdleCallback' in window) {
      requestIdleCallback(startLoad, { timeout: 2000 });
    } else {
      setTimeout(startLoad, 100);
    }

    window.addEventListener('pagehide', function () {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
    });
  </script>
</body>
</html>
