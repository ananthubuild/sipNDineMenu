<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#f5f5f7">
  <title>Sip N Dine Menu</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: opacity 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.55s cubic-bezier(0.4, 0, 0.2, 1),
                  filter 0.55s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #loader.done {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      filter: blur(24px);
    }

    .loader-bg {
      position: absolute;
      inset: 0;
      background: linear-gradient(165deg, #f5f5f7 0%, #e8e8ed 45%, #f0f0f5 100%);
      overflow: hidden;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      animation: drift 8s ease-in-out infinite;
    }

    .orb-1 {
      width: 55vw;
      height: 55vw;
      max-width: 420px;
      max-height: 420px;
      background: radial-gradient(circle, rgba(255, 200, 180, 0.9) 0%, transparent 70%);
      top: -10%;
      left: -15%;
      animation-delay: 0s;
    }

    .orb-2 {
      width: 50vw;
      height: 50vw;
      max-width: 380px;
      max-height: 380px;
      background: radial-gradient(circle, rgba(180, 220, 255, 0.85) 0%, transparent 70%);
      bottom: -5%;
      right: -10%;
      animation-delay: -2.5s;
    }

    .orb-3 {
      width: 40vw;
      height: 40vw;
      max-width: 300px;
      max-height: 300px;
      background: radial-gradient(circle, rgba(220, 255, 200, 0.7) 0%, transparent 70%);
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -5s;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(4%, 6%) scale(1.06); }
      66% { transform: translate(-3%, 4%) scale(0.96); }
    }

    .glass-card {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      padding: 2rem 2.25rem 1.75rem;
      width: min(320px, 88vw);
      border-radius: 28px;
      background: rgba(255, 255, 255, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 0 0 0.5px rgba(0, 0, 0, 0.04),
        0 2px 4px rgba(0, 0, 0, 0.02),
        0 12px 40px rgba(0, 0, 0, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(48px) saturate(190%);
      -webkit-backdrop-filter: blur(48px) saturate(190%);
      animation: card-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
      filter: blur(12px);
      opacity: 0;
    }

    #loader.sharp .glass-card {
      filter: blur(0);
      opacity: 1;
      transition: filter 0.9s cubic-bezier(0.22, 1, 0.36, 1),
                  opacity 0.6s ease;
    }

    @keyframes card-in {
      from {
        opacity: 0;
        transform: scale(0.94) translateY(12px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .loader-gif-wrap {
      width: 140px;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.6);
    }

    .loader-gif {
      width: 120px;
      height: 120px;
      object-fit: contain;
      image-rendering: auto;
    }

    .loader-text {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: -0.01em;
      color: rgba(0, 0, 0, 0.55);
    }

    .progress-wrap {
      width: 100%;
      height: 5px;
      background: rgba(0, 0, 0, 0.06);
      border-radius: 100px;
      overflow: hidden;
      box-shadow: inset 0 0.5px 1px rgba(0, 0, 0, 0.06);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      border-radius: 100px;
      background: linear-gradient(90deg, #1a1a1a 0%, #3a3a3a 100%);
      transition: width 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.15);
    }

    .progress-pct {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: rgba(0, 0, 0, 0.4);
      font-variant-numeric: tabular-nums;
    }

    #viewer {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      opacity: 0;
      transition: opacity 0.45s ease;
    }

    #viewer.ready {
      opacity: 1;
    }
  </style>
</head>
<body>
  <div id="loader" aria-live="polite" aria-busy="true">
    <div class="loader-bg" aria-hidden="true">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>

    <div class="glass-card">
      <div class="loader-gif-wrap">
        <img
          class="loader-gif"
          src="original-b10f1ea4b07bce2beb364c0890c802a7.gif"
          alt=""
          width="120"
          height="120"
        />
      </div>
      <p class="loader-text">Loading menu</p>
      <div
        class="progress-wrap"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="0"
        id="progressbar"
      >
        <div class="progress-bar" id="progress"></div>
      </div>
      <p class="progress-pct" id="pct">0%</p>
    </div>
  </div>

  <embed id="viewer" type="application/pdf" title="Sip N Dine Menu" />

  <script>
    const PDF_URL = 'menu1.pdf';
    const PDF_HASH = '#view=FitH&toolbar=0&navpanes=0';

    const loader = document.getElementById('loader');
    const progress = document.getElementById('progress');
    const pctEl = document.getElementById('pct');
    const progressbar = document.getElementById('progressbar');
    const viewer = document.getElementById('viewer');

    let blobUrl = null;

    requestAnimationFrame(function () {
      loader.classList.add('sharp');
    });

    function setProgress(percent) {
      const p = Math.min(100, Math.round(percent));
      progress.style.width = p + '%';
      pctEl.textContent = p + '%';
      progressbar.setAttribute('aria-valuenow', String(p));
    }

    function hideLoader() {
      loader.classList.add('done');
      loader.setAttribute('aria-busy', 'false');
      viewer.classList.add('ready');
    }

    async function fetchPdf() {
      const res = await fetch(PDF_URL);
      if (!res.ok) throw new Error('Could not load menu');

      const total = Number(res.headers.get('content-length')) || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let loaded = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        loaded += value.length;
        if (total > 0) {
          setProgress((loaded / total) * 100);
        } else {
          setProgress(Math.min(95, loaded / 250000));
        }
      }

      setProgress(100);
      const blob = new Blob(chunks, { type: 'application/pdf' });
      if (blobUrl) URL.revokeObjectURL(blobUrl);
      blobUrl = URL.createObjectURL(blob);
      return blobUrl;
    }

    function showPdf(url) {
      viewer.src = url + PDF_HASH;
      viewer.addEventListener('load', hideLoader, { once: true });
      setTimeout(hideLoader, 900);
    }

    function startLoad() {
      fetchPdf()
        .then(showPdf)
        .catch(function () {
          pctEl.textContent = 'Tap to retry';
          loader.querySelector('.loader-text').textContent = 'Could not load menu';
          loader.style.cursor = 'pointer';
          loader.onclick = function () {
            loader.onclick = null;
            loader.style.cursor = '';
            loader.querySelector('.loader-text').textContent = 'Loading menu';
            pctEl.textContent = '0%';
            setProgress(0);
            startLoad();
          };
        });
    }

    if ('requestIdleCallback' in window) {
      requestIdleCallback(startLoad, { timeout: 2000 });
    } else {
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(startLoad, 100);
      });
    }

    window.addEventListener('pagehide', function () {
      if (blobUrl) URL.revokeObjectURL(blobUrl);
    });
  </script>
</body>
</html>
